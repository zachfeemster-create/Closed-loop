<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;padding:0;background:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none}
  #card{background:radial-gradient(120% 90% at 50% 0%,#24262c 0%,#141519 70%);border-radius:18px;padding:10px 6px 8px;
    box-shadow:0 0 0 1px #2c2f36 inset,0 8px 30px rgba(0,0,0,.45)}
  #card.off{opacity:.62}
  svg{display:block;width:100%;touch-action:none}
  .val{font-size:13px;font-weight:600;text-anchor:middle;font-variant-numeric:tabular-nums}
  .hz{font-size:12px;fill:#c9ccd3;text-anchor:middle}
  .hint{color:#8a8f99;font-size:11px;text-align:center;margin-top:4px}
  #turns{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:6px}
  #turns button{background:#2b2e35;color:#e6e7ea;border:0;border-radius:10px;padding:7px 12px;font:13px system-ui}
  #turns span{color:#c9ccd3;font-size:12px;min-width:120px;text-align:center}
  #card.off #turns{display:none}
</style>
</head>
<body>
<div id="card"><svg id="eq"></svg>
  <div id="turns"><button id="ccw">↺ ¼ turn</button><span id="sel"></span><button id="cw">↻ ¼ turn</button><button id="kind" style="display:none">bell</button></div>
  <div class="hint" id="hint"></div></div>
<script>
const NS = "http://www.w3.org/2000/svg";
const send = (type, extra) => window.parent.postMessage(Object.assign({isStreamlitMessage: true, type}, extra), "*");
let A = null, vals = [], drag = -1, sel = 0, twist = null, W = 360, grab = null;
const KINDS = ["bell", "low shelf", "high shelf", "high pass", "low pass", "notch"];
const CUT = -30;                       // passes and notches cut this deep (dB); their handle height is not used
const H = 300, TOP = 34, BOT = 34, PADX = 22, W0 = 0.7, WMIN = 0.1, WMAX = 3.0;
const pointers = new Map();

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const fmt = v => (v > 0 ? "+" : "") + v.toFixed(1);
const sx = () => (W - 2 * PADX) / (vals.length - 1);            // one band step = one octave
const xAt = i => PADX + i * sx();
const yAt = v => TOP + (A.max - v) / (A.max - A.min) * (H - TOP - BOT);
const vAt = y => Math.round(Math.max(A.min, Math.min(A.max, A.max - (y - TOP) / (H - TOP - BOT) * (A.max - A.min))) * 10) / 10;
const turnsOf = w => Math.log2(w / W0);                              // quarter turns: each one doubles or halves the width
const angOf = w => 90 * turnsOf(w);
const clampW = w => Math.max(WMIN, Math.min(WMAX, w));
// every band is kept as [gain, width, position, kind]; position is in band steps (0..9), kind 0 bell / 1 low shelf / 2 high shelf
const full = vs => vs.map((v, i) => Array.isArray(v) ? [Number(v[0]), Number(v[1] ?? W0), Number(v[2] ?? i), Number(v[3] ?? 0)] : [Number(v), W0, i, 0]);
const norm = vs => JSON.stringify(full(vs));
const extended = () => A && (A.slide || A.shelves);
const sent = new Set();                // values we sent ourselves; the page echoes them back a rerun late, so don't reset to those
const send_ = () => { const v = vals.map(v => extended() ? [v[0], Math.round(v[1] * 1000) / 1000, Math.round(v[2] * 1000) / 1000, v[3]] : [v[0], Math.round(v[1] * 1000) / 1000]);
  sent.add(norm(v)); send("streamlit:setComponentValue", {value: v, dataType: "json"}); };
// what the bands add up to at a point (in band-steps = octaves)
const shape = (x, [g, w, c, k]) => k === 1 ? g / (1 + Math.exp((x - c) / (0.6 * w))) : k === 2 ? g / (1 + Math.exp(-(x - c) / (0.6 * w)))
  : k === 3 ? CUT / (1 + Math.exp((x - c) / (0.3 * w))) : k === 4 ? CUT / (1 + Math.exp(-(x - c) / (0.3 * w)))
  : k === 5 ? CUT * Math.exp(-0.5 * ((x - c) / w) ** 2) : g * Math.exp(-0.5 * ((x - c) / w) ** 2);
const resp = u => vals.reduce((s, v) => s + shape(u, v), 0);
const xU = u => PADX + u * sx();

function draw() {
  const svg = document.getElementById("eq");
  W = Math.max(300, svg.parentNode.clientWidth - 12);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("height", H);
  svg.innerHTML = "";
  const defs = el("defs", {}, svg);
  const glow = el("filter", {id: "glow", x: "-30%", y: "-30%", width: "160%", height: "160%"}, defs);
  el("feGaussianBlur", {stdDeviation: "4", result: "b"}, glow);
  const m = el("feMerge", {}, glow); el("feMergeNode", {in: "b"}, m); el("feMergeNode", {in: "b"}, m); el("feMergeNode", {in: "SourceGraphic"}, m);
  const fill = el("linearGradient", {id: "fill", x1: 0, y1: 0, x2: 1, y2: 0}, defs);
  A.colors.forEach((c, i) => el("stop", {offset: i / (A.colors.length - 1), "stop-color": c, "stop-opacity": .28}, fill));
  const line = el("linearGradient", {id: "line", x1: 0, y1: 0, x2: 1, y2: 0}, defs);
  A.colors.forEach((c, i) => el("stop", {offset: i / (A.colors.length - 1), "stop-color": c}, line));
  A.colors.forEach((c, i) => {
    const g = el("radialGradient", {id: "halo" + i}, defs);
    el("stop", {offset: 0, "stop-color": c, "stop-opacity": .85}, g);
    el("stop", {offset: 1, "stop-color": c, "stop-opacity": 0}, g);
  });

  for (let v = Math.ceil(A.min / 2) * 2; v <= A.max; v += 2)
    el("line", {x1: PADX - 8, x2: W - PADX + 8, y1: yAt(v), y2: yAt(v), stroke: v === 0 ? "#5d626c" : "#2b2e35", "stroke-width": v === 0 ? 1.4 : 1}, svg);

  // each band's own bell at its real width, faint and glowing (Parametric EQ 2 style)
  const zero = yAt(0), STEPS = 120;
  vals.forEach((v, i) => {
    const [g, w, c, kd] = v;
    if (Math.abs(g) < 0.05 && kd < 3 && i !== sel) return;
    const lo = kd === 1 || kd === 3 ? -0.3 : c - 3 * w, hi = kd === 2 || kd === 4 ? vals.length - 0.7 : c + 3 * w;
    let d = "";
    for (let k = 0; k <= STEPS; k++) { const u = lo + (hi - lo) * k / STEPS; d += (k ? " L" : "M") + `${xU(u)},${yAt(Math.max(A.min, Math.min(A.max, shape(u, v))))}`; }
    el("path", {d: `${d} L${xU(hi)},${zero} L${xU(lo)},${zero} Z`, fill: A.colors[i],
      "fill-opacity": i === sel ? .24 : .14, stroke: A.colors[i], "stroke-opacity": i === sel ? .9 : .5, "stroke-width": i === sel ? 1.6 : 1.1, filter: "url(#glow)"}, svg);
  });

  // what they add up to: filled, then a glowing line
  let path = "";
  for (let k = 0; k <= 240; k++) { const u = (vals.length - 1) * k / 240; path += (k ? " L" : "M") + `${PADX + u * sx()},${yAt(Math.max(A.min, Math.min(A.max, resp(u))))}`; }
  el("path", {d: `${path} L${xAt(vals.length - 1)},${H - BOT} L${xAt(0)},${H - BOT} Z`, fill: "url(#fill)"}, svg);
  el("path", {d: path, fill: "none", stroke: "url(#line)", "stroke-width": 7, "stroke-opacity": .35, filter: "url(#glow)"}, svg);
  el("path", {d: path, fill: "none", stroke: "url(#line)", "stroke-width": 2.6}, svg);

  vals.forEach(([g, , c], i) => {
    const t = el("text", {x: xU(c), y: 20, class: "val", fill: A.colors[i]}, svg); t.textContent = fmt(g);
    const h = el("text", {x: xAt(i), y: H - 10, class: "hz"}, svg); h.textContent = A.labels[i];
  });

  // the sigil handles: halo in the band color, and the sigil turned by its quarter turns
  const S = A.size;
  vals.forEach(([g, w, c], i) => {
    const x = xU(c), y = hy(i), on = drag === i || i === sel;
    const grp = el("g", {style: A.disabled ? "" : "cursor:grab"}, svg);
    el("circle", {cx: x, cy: y, r: S * (on ? 1.05 : .8), fill: `url(#halo${i})`}, grp);
    if (i === sel && !A.disabled) el("circle", {cx: x, cy: y, r: S * .72, fill: "none", stroke: A.colors[i], "stroke-width": 1.2, "stroke-dasharray": "3 4", opacity: .9}, grp);
    el("image", {href: A.sigils[i], x: x - S / 2, y: y - S / 2, width: S, height: S, transform: `rotate(${angOf(w)} ${x} ${y})`,
      style: `filter:drop-shadow(0 0 ${on ? 9 : 5}px ${A.colors[i]})`}, grp);
  });
  const [g, w, c, kd] = vals[sel] || [0, W0, 0, 0];
  const where = A.slide && Math.abs(c - sel) > 0.02 ? ` @ ${A.unit ? (44100 / (A.base * Math.pow(2, c))).toFixed(1) + " " + A.unit + " cycle" : (c >= sel ? "+" : "") + (c - sel).toFixed(2) + " oct"}` : "";
  document.getElementById("sel").innerHTML = `<b style="color:${A.colors[sel]}">${A.labels[sel]}</b>${where} · ${A.shelves ? KINDS[kd] + " · " : ""}width ${w.toFixed(2)} oct · ${turnsOf(w) >= 0 ? "+" : ""}${turnsOf(w).toFixed(2)} turns`;
  const kb = document.getElementById("kind"); kb.style.display = A.shelves && !A.disabled ? "" : "none"; kb.textContent = "shape: " + KINDS[kd];
}

function local(evt) {
  const svg = document.getElementById("eq"), r = svg.getBoundingClientRect();
  return {x: (evt.clientX - r.left) * W / r.width, y: (evt.clientY - r.top) * H / r.height};
}
const nearest = x => vals.reduce((b, v, i) => Math.abs(xU(v[2]) - x) < Math.abs(xU(vals[b][2]) - x) ? i : b, 0);
// where a handle is drawn: passes and notches sit on the zero line (their height isn't a gain)
const hy = i => vals[i][3] >= 3 ? yAt(0) : yAt(vals[i][0]);
// the sigil actually under the finger (within its glow), or -1: touching empty space grabs nothing
const under = p => { let best = -1, bd = Infinity;
  vals.forEach((v, i) => { const d = Math.hypot(xU(v[2]) - p.x, hy(i) - p.y); if (d < bd) { bd = d; best = i; } });
  return bd <= A.size * 1.1 ? best : -1; };
const angle2 = () => { const [a, b] = [...pointers.values()]; return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI; };

const svgEl = document.getElementById("eq");
svgEl.addEventListener("pointerdown", e => {
  if (A.disabled) return;
  svgEl.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, local(e));
  if (pointers.size === 1) {                                       // grab only the sigil under the finger; it stays locked till you let go
    const p = local(e), i = under(p);
    if (i >= 0) { drag = sel = i; grab = {x: p.x, y: p.y, c: vals[i][2], g: vals[i][0]}; } else { drag = -1; grab = null; }
  }
  else if (pointers.size === 2) {                                   // two fingers: twist to rotate the band's shape
    const [a, b] = [...pointers.values()]; sel = drag >= 0 ? drag : nearest((a.x + b.x) / 2); drag = -1;   // keep the one you're holding
    twist = {a0: angle2(), w0: vals[sel][1]};
  }
  draw();
});
svgEl.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, local(e));
  if (twist && pointers.size === 2) { let d = angle2() - twist.a0; d = ((d + 540) % 360) - 180; vals[sel][1] = clampW(twist.w0 * Math.pow(2, d / 90)); draw(); }
  else if (drag >= 0 && grab && pointers.size === 1) { const p = local(e);
    if (vals[drag][3] < 3) vals[drag][0] = vAt(yAt(grab.g) + (p.y - grab.y));       // moves from where you grabbed it, no jump
    if (A.slide) vals[drag][2] = Math.max(-0.5, Math.min(vals.length - 0.5, grab.c + (p.x - grab.x) / sx())); draw(); }
});
const lift = e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size === 0) { const changed = drag >= 0 || twist; drag = -1; grab = null; twist = null; draw(); if (changed) send_(); }
};
svgEl.addEventListener("pointerup", lift);
svgEl.addEventListener("pointercancel", lift);
svgEl.addEventListener("dblclick", e => {
  if (A.disabled) return;
  const i = under(local(e)); if (i < 0) return; vals[i] = [0, W0, i, 0]; sel = i; draw(); send_();
});
svgEl.addEventListener("wheel", e => {                              // mouse wheel turns the selected band too
  if (A.disabled) return; e.preventDefault();
  vals[sel][1] = clampW(vals[sel][1] * Math.pow(2, (e.deltaY < 0 ? 15 : -15) / 90)); draw();
  clearTimeout(window._wt); window._wt = setTimeout(send_, 350);
}, {passive: false});
const quarter = dir => { if (A.disabled) return; vals[sel][1] = clampW(vals[sel][1] * Math.pow(2, dir)); draw(); send_(); };
document.getElementById("cw").onclick = () => quarter(1);
document.getElementById("ccw").onclick = () => quarter(-1);
document.getElementById("kind").onclick = () => { if (A.disabled) return; vals[sel][3] = (vals[sel][3] + 1) % KINDS.length; draw(); send_(); };

window.addEventListener("message", e => {
  if (!e.data || e.data.type !== "streamlit:render") return;
  const incoming = norm(e.data.args.values), first = A === null || (incoming !== norm(A.values) && !sent.has(incoming));
  A = e.data.args;
  if (first && drag < 0 && !twist) { vals = JSON.parse(incoming); sent.clear(); }
  document.getElementById("card").classList.toggle("off", !!A.disabled);
  document.getElementById("hint").textContent = A.disabled ? "Preset (pick Custom to shape it)"
    : (A.slide ? "Grab a sigil (only that one moves till you let go): up/down for gain, left/right to move it" : "Grab a sigil and drag it up or down")
      + " · twist two fingers (or the ¼ turn buttons) to shape it" + (A.shelves ? " · 'shape' cycles bell / shelves / high & low pass / notch" : "") + " · double-tap to reset";
  draw();
  send("streamlit:setFrameHeight", {height: document.body.scrollHeight + 4});
});
window.addEventListener("resize", () => { if (A) draw(); });
send("streamlit:componentReady", {apiVersion: 1});
</script>
</body>
</html>
