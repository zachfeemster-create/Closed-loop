name: Closed Loop weekly

on:
  schedule:
    - cron: "23 9 * * 0"         # Sundays, about an hour after the nightly
  workflow_dispatch: {}         # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: closed-loop-autorun
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas scipy
      - name: Cross-feed tests and the luck-pile pass
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python autorun/weekly.py
      - name: Save results
        run: |
          git config user.name "closed-loop-bot"
          git config user.email "closed-loop-bot@users.noreply.github.com"
          git add autorun
          git diff --cached --quiet && exit 0
          git commit -m "Weekly run $(date -u +%F)"
          git pull --rebase
          git push
