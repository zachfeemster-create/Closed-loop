name: Closed Loop nightly

on:
  schedule:
    - cron: "17 8 * * *"        # every night, about 2:17 am Mountain
  workflow_dispatch: {}         # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: closed-loop-autorun
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas scipy
      - name: Pull feeds, rotate, let Max watch
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python autorun/nightly.py
      - name: Save results
        run: |
          git config user.name "closed-loop-bot"
          git config user.email "closed-loop-bot@users.noreply.github.com"
          git add autorun
          git diff --cached --quiet && exit 0
          git commit -m "Nightly run $(date -u +%F)"
          git pull --rebase
          git push
